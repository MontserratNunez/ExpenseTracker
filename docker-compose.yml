services:
  web:
    build: .
    ports: ["8080:8080"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__ExpenseTracker=Server=db;Database=ExpenseTracker;User Id=sa;Password=${DB_PASSWORD:?Define DB_PASSWORD in the .env file};TrustServerCertificate=True
      - ApplyMigrationsOnStartup=true
      - DataProtection__KeysPath=/keys
    volumes: ["dpkeys:/keys"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:?Define DB_PASSWORD in the .env file}
    volumes: ["sqldata:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

volumes:
  sqldata:
  dpkeys:
