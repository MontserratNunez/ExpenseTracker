name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      - name: Check there are no emojis in the UI
        run: |
          export LC_ALL=C.UTF-8
          ! grep -rnP "[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}]" src/Presentation --include=*.razor --include=*.cs --include=*.css

      # Only the unit tests run here. The browser tests (tests/ExpenseTracker.E2E) need Chrome and SQL Server LocalDB,
      # so they are built with the solution but run only on a developer machine (E2E=1).
      - run: dotnet test tests/ExpenseTracker.Tests --no-build -c Release --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
